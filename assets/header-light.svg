<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-label="Manav Choudhary — building at the intersection of systems, intelligence and biology">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#D5DDE6"/>
    </pattern>

    <mask id="dotmask">
      <rect width="1200" height="280" fill="url(#fade)"/>
    </mask>

    <clipPath id="card">
      <rect width="1200" height="280" rx="18"/>
    </clipPath>

    <style>
      .n { animation: pulse 4.4s ease-in-out infinite; }
      .n:nth-of-type(2n) { animation-delay: -1.1s; }
      .n:nth-of-type(3n) { animation-delay: -2.3s; }
      .n:nth-of-type(5n) { animation-delay: -3.4s; }
      @keyframes pulse {
        0%, 100% { opacity: .4; }
        50%      { opacity: 1; }
      }
      .edge {
        stroke-dasharray: 5 7;
        animation: flow 3.2s linear infinite;
      }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      .rule { animation: grow 2.6s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes grow {
        0%, 100% { opacity: .6; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .n, .edge, .rule { animation: none; opacity: .85; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#FFFFFF"/>
    <rect width="1200" height="280" fill="url(#dots)" mask="url(#dotmask)" opacity="0.9"/>
    <ellipse cx="980" cy="70"  rx="330" ry="230" fill="url(#glow)"/>
    <ellipse cx="1130" cy="250" rx="280" ry="200" fill="url(#glow2)"/>

    <!-- node network -->
    <g stroke="#0D9488" stroke-opacity="0.45" stroke-width="1.3" fill="none">
      <path class="edge" d="M862 82 L964 62"/>
      <path class="edge" d="M964 62 L1064 98"/>
      <path class="edge" d="M862 82 L902 152"/>
      <path class="edge" d="M964 62 L1010 156"/>
      <path class="edge" d="M1064 98 L1110 152"/>
      <path class="edge" d="M902 152 L1010 156"/>
      <path class="edge" d="M1010 156 L1110 152"/>
      <path class="edge" d="M902 152 L858 216"/>
      <path class="edge" d="M902 152 L966 234"/>
      <path class="edge" d="M1010 156 L1076 212"/>
      <path class="edge" d="M858 216 L966 234"/>
      <path class="edge" d="M966 234 L1076 212"/>
    </g>
    <g fill="url(#accent)">
      <circle class="n" cx="862"  cy="82"  r="5"/>
      <circle class="n" cx="964"  cy="62"  r="7"/>
      <circle class="n" cx="1064" cy="98"  r="4.5"/>
      <circle class="n" cx="902"  cy="152" r="8"/>
      <circle class="n" cx="1010" cy="156" r="6"/>
      <circle class="n" cx="1110" cy="152" r="4.5"/>
      <circle class="n" cx="858"  cy="216" r="5.5"/>
      <circle class="n" cx="966"  cy="234" r="4.5"/>
      <circle class="n" cx="1076" cy="212" r="6.5"/>
    </g>

    <!-- type -->
    <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"
          font-size="14" letter-spacing="3.4" fill="#0F766E">CS @ BITS PILANI × KIIT — 2027</text>

    <text x="62" y="152" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1.4" fill="#0F172A">Manav Choudhary</text>

    <rect class="rule" x="64" y="180" width="96" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="64" y="222" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
          font-size="18" fill="#57606A">Building at the intersection of systems, intelligence &amp; biology.</text>

    <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#D8DEE4"/>
  </g>
</svg>
